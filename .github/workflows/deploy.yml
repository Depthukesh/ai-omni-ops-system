name: Deploy To Aliyun ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: ${{ secrets.ALIYUN_PORT }}
          script: |
            set -e

            cd ${{ secrets.DEPLOY_PATH }}

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            npm ci
            npm run prisma:generate
            npx prisma migrate deploy --schema prisma/schema.prisma || true

            npm run build:server
            npm run build:web

            pm2 restart ai-omni-server || pm2 start "npm --workspace apps/server run start" --name ai-omni-server
            pm2 restart ai-omni-web || pm2 start "npm --workspace apps/web run start -- -p 3001" --name ai-omni-web

            pm2 save
