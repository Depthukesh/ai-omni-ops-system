name: Deploy To Aliyun ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: ${{ secrets.ALIYUN_PORT }}
          script: |
            set -euo pipefail
            APP_RUNTIME_USER="aiops"

            if ! id -u "$APP_RUNTIME_USER" >/dev/null 2>&1; then
              useradd --system --create-home --shell /bin/bash "$APP_RUNTIME_USER"
            fi

            install -d -m 755 -o "$APP_RUNTIME_USER" -g "$APP_RUNTIME_USER" "/home/$APP_RUNTIME_USER/.pm2"
            chown -R "$APP_RUNTIME_USER:$APP_RUNTIME_USER" "${{ secrets.DEPLOY_PATH }}"

            runuser -u "$APP_RUNTIME_USER" -- bash -lc '
              set -euo pipefail
              cd "${{ secrets.DEPLOY_PATH }}"

              git fetch origin main
              git checkout main

              PRE_DEPLOY_STATUS="$(git status --porcelain=v1 -uall)"
              if [ -n "$PRE_DEPLOY_STATUS" ]; then
                echo "部署终止：服务器工作区存在未收口改动或额外文件。"
                printf "%s\n" "$PRE_DEPLOY_STATUS"
                exit 1
              fi

              git pull --ff-only origin main

              POST_PULL_STATUS="$(git status --porcelain=v1 -uall)"
              if [ -n "$POST_PULL_STATUS" ]; then
                echo "部署终止：拉取后工作区未保持干净，请先人工排查服务器现场。"
                printf "%s\n" "$POST_PULL_STATUS"
                exit 1
              fi

              npm ci
              npm run prisma:generate
              npm run prisma:db:push

              npm run build:server
              npm run build:web

              pm2 startOrReload ecosystem.config.cjs --update-env
              pm2 save
            '

            wait_for_http() {
              local url="$1"
              local max_attempts="${2:-30}"
              local sleep_seconds="${3:-2}"
              local attempt=1
              while [ "$attempt" -le "$max_attempts" ]; do
                if curl -fsS "$url" >/dev/null; then
                  echo "健康检查通过: $url"
                  return 0
                fi
                echo "等待服务就绪 ($attempt/$max_attempts): $url"
                sleep "$sleep_seconds"
                attempt=$((attempt + 1))
              done
              echo "部署终止：服务在等待窗口内未就绪 -> $url"
              return 1
            }

            LOCAL_LISTENERS="$(ss -lnt | grep -E ':(80|443|3001|3011)\b' || true)"
            printf '%s\n' "$LOCAL_LISTENERS"

            if ss -lnt | grep -qE '0\.0\.0\.0:3001|:::3001|0\.0\.0\.0:3011|:::3011'; then
              echo "部署终止：检测到 3001/3011 仍对公网监听。"
              exit 1
            fi

            wait_for_http http://127.0.0.1:3011/api/health
            wait_for_http http://127.0.0.1:3001
