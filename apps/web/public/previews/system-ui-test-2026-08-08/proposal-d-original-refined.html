<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>原结构优化版 - 品牌增长工作台</title>
  <style>
    /* 
     * Taste-Skill Guidelines Applied:
     * 1. Clear Hierarchy: Sidebar vs Main Content distinct separation.
     * 2. Typography: Inter/System fonts, tight line-heights for headings, relaxed for body.
     * 3. Borders & Shadows: Crisp 1px borders, subtle/no shadows for structural elements to reduce "cheap generic" feel.
     * 4. Spacing Rhythm: Consistent 16px/24px/32px spacing.
     * 5. Colors: Neutral grays with a restrained primary accent color.
     */
    :root {
      --bg-app: #f8fafc;
      --bg-surface: #ffffff;
      --bg-surface-hover: #f1f5f9;
      --bg-sidebar: #ffffff;
      
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-soft: #94a3b8;
      
      --border: #e2e8f0;
      --border-focus: #cbd5e1;
      
      --primary: #0f172a;
      --primary-hover: #334155;
      --primary-fg: #ffffff;
      
      --success-bg: #dcfce7;
      --success-fg: #166534;
      
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Layout Shell */
    .global-topbar {
      height: 60px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
    }
    .global-topbar .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      font-size: 15px;
      color: var(--text-main);
    }
    .global-topbar .brand-logo {
      width: 32px;
      height: 32px;
      background: var(--primary);
      color: var(--primary-fg);
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 700;
    }
    .global-topbar-nav {
      display: flex;
      gap: 32px;
    }
    .global-topbar-nav a {
      text-decoration: none;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      transition: color 0.15s;
    }
    .global-topbar-nav a:hover {
      color: var(--text-main);
    }
    .global-topbar-nav a.is-active {
      color: var(--text-main);
      font-weight: 600;
    }
    .global-topbar-user {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .archive-shell {
      flex: 1;
      display: flex;
      width: 100%;
      overflow: hidden;
    }
    .strategy-layout {
      display: flex;
      width: 100%;
      height: 100%;
      max-width: 1600px;
      margin: 0 auto;
      background: var(--bg-app);
    }

    /* Sidebar */
    .strategy-level-panel {
      width: 260px;
      flex-shrink: 0;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 20px 12px;
    }

    /* Sidebar Group */
    .strategy-section-group {
      margin-bottom: 8px;
    }
    .strategy-level-button--section {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: transparent;
      border: none;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: background 0.15s, color 0.15s;
    }
    .strategy-level-button--section:hover {
      background: var(--bg-surface-hover);
      color: var(--text-main);
    }
    .strategy-level-chevron {
      font-size: 12px;
      color: var(--text-soft);
      transition: transform 0.2s ease;
    }
    .strategy-level-chevron.is-expanded {
      transform: rotate(180deg);
    }

    /* Sidebar Nested Items */
    .strategy-submenu {
      display: none;
      padding-top: 4px;
      padding-bottom: 8px;
    }
    .strategy-submenu.is-expanded {
      display: block;
    }
    .strategy-level-button-list--nested {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .strategy-level-button--nested {
      width: 100%;
      text-align: left;
      padding: 8px 12px 8px 32px;
      background: transparent;
      border: none;
      font-size: 14px;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: background 0.15s, color 0.15s;
    }
    .strategy-level-button--nested:hover {
      background: var(--bg-surface-hover);
      color: var(--text-main);
    }
    .strategy-level-button--nested.is-active {
      background: var(--bg-surface-hover);
      color: var(--text-main);
      font-weight: 500;
    }

    /* Main Content */
    .strategy-content-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 32px 48px;
      gap: 24px;
    }

    /* Header Panel */
    .strategy-page-header {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      box-shadow: var(--shadow-sm);
    }
    .strategy-page-header strong {
      display: block;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
    }
    .strategy-page-header p {
      margin: 0;
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .strategy-page-header-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 16px;
    }
    .workspace-status {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }
    .archive-pill {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 500;
      font-size: 12px;
    }
    .status-ready {
      background: var(--success-bg);
      color: var(--success-fg);
    }
    .success-text {
      color: var(--success-fg);
    }
    .strategy-inline-actions {
      display: flex;
      gap: 12px;
    }

    /* Buttons */
    button {
      font-family: inherit;
      cursor: pointer;
    }
    .secondary-button, .primary-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      border-radius: var(--radius-sm);
      transition: all 0.15s;
      border: 1px solid transparent;
    }
    .secondary-button {
      background: var(--bg-surface);
      border-color: var(--border);
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }
    .secondary-button:hover {
      background: var(--bg-surface-hover);
      border-color: var(--border-focus);
    }
    .primary-button {
      background: var(--primary);
      color: var(--primary-fg);
      border-color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .primary-button:hover {
      background: var(--primary-hover);
    }

    /* Content Area (Mocking Brand Background Form) */
    .content-area {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .content-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 32px;
      box-shadow: var(--shadow-sm);
    }
    .content-card h3 {
      margin: 0 0 24px 0;
      font-size: 16px;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    
    /* Form Grid */
    .form-grid {
      display: grid;
      grid-template-columns: minmax(200px, 1fr) minmax(200px, 1fr);
      gap: 24px 32px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-group.full-width {
      grid-column: 1 / -1;
    }
    .form-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }
    .form-value {
      font-size: 15px;
      color: var(--text-main);
      line-height: 1.6;
      padding: 12px 16px;
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .form-value.textarea {
      min-height: 100px;
    }
  </style>
</head>
<body>
  <header class="global-topbar">
    <div class="brand">
      <div class="brand-logo">17</div>
      <span>AI 全域运营系统</span>
    </div>
    <nav class="global-topbar-nav">
      <a href="#" class="is-active">品牌增长</a>
      <a href="#">小红书</a>
      <a href="#">抖音</a>
      <a href="#">公众号</a>
      <a href="#">设计</a>
      <a href="#">后台</a>
    </nav>
    <div class="global-topbar-user">
      <span>当前品牌：示例科技</span>
      <div style="width: 28px; height: 28px; background: #e2e8f0; border-radius: 50%;"></div>
    </div>
  </header>
  <main class="archive-shell strategy-shell">
    <section class="strategy-layout">
      
      <!-- Left Sidebar (Original Structure) -->
      <aside class="strategy-level-panel strategy-level-panel--directory strategy-level-panel--accordion">
        <div class="strategy-level-button-list strategy-level-button-list--accordion">
          
          <!-- Section 1 -->
          <div class="strategy-section-group is-expanded is-active">
            <button type="button" class="strategy-level-button strategy-level-button--section is-active" aria-expanded="true">
              <span>品牌资料库</span>
              <span class="strategy-level-chevron is-expanded" aria-hidden="true">▾</span>
            </button>
            <div class="strategy-submenu is-expanded">
              <div class="strategy-level-button-list strategy-level-button-list--nested">
                <button type="button" class="strategy-level-button strategy-level-button--nested is-active">品牌背景资料</button>
                <button type="button" class="strategy-level-button strategy-level-button--nested">产品资料库</button>
                <button type="button" class="strategy-level-button strategy-level-button--nested">品牌运营情况</button>
                <button type="button" class="strategy-level-button strategy-level-button--nested">第三方数据</button>
                <button type="button" class="strategy-level-button strategy-level-button--nested">企业知识库</button>
              </div>
            </div>
          </div>

          <!-- Section 2 -->
          <div class="strategy-section-group">
            <button type="button" class="strategy-level-button strategy-level-button--section" aria-expanded="false">
              <span>收集数据</span>
              <span class="strategy-level-chevron" aria-hidden="true">▾</span>
            </button>
            <div class="strategy-submenu">
              <div class="strategy-level-button-list strategy-level-button-list--nested">
                <button type="button" class="strategy-level-button strategy-level-button--nested">小红书</button>
                <button type="button" class="strategy-level-button strategy-level-button--nested">抖音</button>
                <button type="button" class="strategy-level-button strategy-level-button--nested">公众号</button>
                <button type="button" class="strategy-level-button strategy-level-button--nested">每日热点</button>
              </div>
            </div>
          </div>

          <!-- Section 3 -->
          <div class="strategy-section-group">
            <button type="button" class="strategy-level-button strategy-level-button--section" aria-expanded="false">
              <span>品牌增长报告</span>
              <span class="strategy-level-chevron" aria-hidden="true">▾</span>
            </button>
            <div class="strategy-submenu">
              <div class="strategy-level-button-list strategy-level-button-list--nested">
                <button type="button" class="strategy-level-button strategy-level-button--nested">机会洞察</button>
                <button type="button" class="strategy-level-button strategy-level-button--nested">生成品牌增长报告</button>
                <button type="button" class="strategy-level-button strategy-level-button--nested">品牌增长可视化报告</button>
                <button type="button" class="strategy-level-button strategy-level-button--nested">半年营销规划</button>
                <button type="button" class="strategy-level-button strategy-level-button--nested">营销日历</button>
              </div>
            </div>
          </div>

        </div>
      </aside>

      <!-- Main Content (Original Structure) -->
      <section class="strategy-content-panel">
        
        <!-- Header -->
        <article class="workspace-panel strategy-page-header">
          <div>
            <strong>品牌背景资料</strong>
            <p>维护品牌基础信息、企业介绍和建档底座。</p>
          </div>
          <div class="strategy-page-header-actions">
            <div class="workspace-status">
              <span class="archive-pill status-ready">接口数据</span>
              <span class="status-text success-text">数据已同步。</span>
            </div>
            <div class="strategy-inline-actions">
              <button type="button" class="secondary-button">刷新数据</button>
              <button type="button" class="primary-button">编辑资料</button>
            </div>
          </div>
        </article>

        <!-- Content Area -->
        <div class="content-area">
          <article class="content-card">
            <h3>基础信息</h3>
            <div class="form-grid">
              <div class="form-group">
                <span class="form-label">品牌名称</span>
                <div class="form-value">示例科技 (Example Tech)</div>
              </div>
              <div class="form-group">
                <span class="form-label">所属行业</span>
                <div class="form-value">人工智能 / 软件服务</div>
              </div>
              <div class="form-group full-width">
                <span class="form-label">品牌简介</span>
                <div class="form-value textarea">
                  我们是一家专注于企业级 AI 解决方案的科技公司，致力于通过智能体网络提升企业的全域运营效率。
                  核心主张是“数据驱动，智能决策”。
                </div>
              </div>
            </div>
          </article>
          
          <article class="content-card">
            <h3>品牌资产</h3>
            <div class="form-grid">
              <div class="form-group">
                <span class="form-label">品牌 Logo</span>
                <div class="form-value" style="display: flex; align-items: center; justify-content: center; height: 120px; border-style: dashed;">
                  [ Logo 占位图 ]
                </div>
              </div>
              <div class="form-group">
                <span class="form-label">主视觉色</span>
                <div class="form-value" style="display: flex; align-items: center; gap: 12px;">
                  <div style="width: 24px; height: 24px; background: #0f172a; border-radius: 4px;"></div>
                  #0F172A (Slate 900)
                </div>
              </div>
            </div>
          </article>
        </div>

      </section>
    </section>
  </main>
</body>
</html>
